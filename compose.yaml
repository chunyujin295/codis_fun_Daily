services:
  daily-knowledge:
    build: .
    image: daily-knowledge:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/daily-knowledge.db
      PUBLIC_BASE_URL: https://codis.fun/Daily
      RUN_TTS_WORKER: "true"
    ports:
      - "127.0.0.1:${DAILY_PORT:-3000}:3000"
    volumes:
      - daily-knowledge-data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  daily-knowledge-data:
